# PROD overrides — NOT loaded automatically.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  web:
    # Migrations + collectstatic run once in deploy.sh (NOT here), so multiple
    # container starts / workers never race to create the schema.
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DEBUG: "False"

  worker:
    restart: unless-stopped

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped
