# PROD overrides — NOT loaded automatically.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  web:
    # collectstatic runs here so files land in the SAME container gunicorn serves
    # from (WhiteNoise reads /app/staticfiles). migrate is NOT here — it runs once
    # in deploy.sh to avoid concurrent-migrate races on boot.
    command: >
      sh -c "python manage.py collectstatic --noinput --ignore=src &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DEBUG: "False"

  worker:
    restart: unless-stopped

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped
