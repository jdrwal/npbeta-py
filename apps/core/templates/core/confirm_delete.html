{% extends "base.html" %}
{% block title %}{{ title }} — npbeta{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<p>Are you sure you want to delete <strong>{{ object }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
    <a href="{{ request.META.HTTP_REFERER|default:'/' }}">Cancel</a>
</form>
{% endblock %}
