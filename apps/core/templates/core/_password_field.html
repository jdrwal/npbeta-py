{% comment %}Password input with a show/hide toggle and optional tooltip help.{% endcomment %}
<div>
    <div class="mb-1 flex items-center gap-1.5">
        <label for="{{ field.id_for_label }}" class="!mb-0">{{ field.label }}</label>
        {% if field.help_text %}
        <span class="group relative inline-flex">
            <svg class="h-4 w-4 cursor-help text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            <span class="pointer-events-none absolute left-1/2 top-6 z-20 hidden w-72 -translate-x-1/2 rounded-lg bg-gray-900 px-3 py-2 text-xs leading-relaxed text-gray-100 shadow-lg group-hover:block [&_ul]:list-disc [&_ul]:space-y-1 [&_ul]:pl-4">
                {{ field.help_text|safe }}
            </span>
        </span>
        {% endif %}
    </div>
    <div class="pw-wrap relative">
        {{ field }}
        <button type="button" class="pw-toggle" data-target="{{ field.id_for_label }}" aria-label="Pokaż lub ukryj hasło">
            <svg class="eye h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off hidden h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
        </button>
    </div>
    {% if field.errors %}<span class="mt-1 block text-sm text-rose-600">{{ field.errors|striptags }}</span>{% endif %}
</div>
