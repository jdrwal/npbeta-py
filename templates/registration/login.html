{% extends "base.html" %}
{% block title %}Sign in — npbeta{% endblock %}
{% block content %}
<form class="login" method="post">
    {% csrf_token %}
    <h1>Sign in</h1>
    {% if form.errors %}<div class="msg">Invalid email or password.</div>{% endif %}
    <label for="id_username">Email</label>
    {{ form.username }}
    <label for="id_password">Password</label>
    {{ form.password }}
    <button type="submit">Sign in</button>
    <input type="hidden" name="next" value="{{ next }}">
</form>
{% endblock %}
