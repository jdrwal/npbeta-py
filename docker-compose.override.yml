# DEV overrides — loaded automatically by `docker compose up`.
# Mounts source for hot-reload and runs Django's dev server.

services:
  web:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "True"

  worker:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    volumes:
      - .:/app

  db:
    ports:
      - "5432:5432"

  # Local email catcher: SMTP on 1025, web inbox on http://localhost:8025.
  # Point EMAIL_* in .env at it (EMAIL_HOST=mailpit, EMAIL_PORT=1025, EMAIL_USE_TLS=False).
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
