# nginx reverse proxy for the Rozlicz Najem Django app.
#
# The app runs in a container (docker/podman compose, prod override) as Gunicorn
# bound to 127.0.0.1:8000. This is a PURE reverse proxy — no PHP/FastCGI. Static
# files are served by WhiteNoise from inside the app (collectstatic runs on deploy).
#
# Canonical host is rozlicz-najem.pl (no www). Redirects:
#   http://(www.)rozlicz-najem.pl  ->  https://rozlicz-najem.pl
#   https://www.rozlicz-najem.pl   ->  https://rozlicz-najem.pl
# The TLS certificate MUST cover both names:
#   certbot --nginx -d rozlicz-najem.pl -d www.rozlicz-najem.pl
#
# Install: copy to /etc/nginx/sites-available/rozlicz-najem.pl, symlink into
# sites-enabled, `nginx -t`, then `systemctl reload nginx`.

upstream rozlicz_najem_app {
    server 127.0.0.1:8000;
}

# 1) HTTP (both hosts) -> HTTPS canonical (non-www). Keep the ACME path open.
server {
    listen 80;
    listen [::]:80;
    server_name rozlicz-najem.pl www.rozlicz-najem.pl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://rozlicz-najem.pl$request_uri;
    }
}

# 2) HTTPS www -> HTTPS canonical (non-www).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rozlicz-najem.pl;

    ssl_certificate /etc/letsencrypt/live/rozlicz-najem.pl/fullchain.pem;      # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rozlicz-najem.pl/privkey.pem;    # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    return 301 https://rozlicz-najem.pl$request_uri;
}

# 3) HTTPS canonical host -> the app.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rozlicz-najem.pl;

    ssl_certificate /etc/letsencrypt/live/rozlicz-najem.pl/fullchain.pem;      # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rozlicz-najem.pl/privkey.pem;    # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Allow reasonable uploads (ISO/OVA links are just URLs, but leave headroom).
    client_max_body_size 25m;

    # WhiteNoise already serves /static/ from the app. If you bind-mount the
    # collected static dir to the host, nginx can serve it faster — uncomment:
    # location /static/ {
    #     alias /srv/rozlicz-najem/staticfiles/;
    #     access_log off;
    #     expires 30d;
    # }

    location / {
        proxy_pass http://rozlicz_najem_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Critical: Django uses SECURE_PROXY_SSL_HEADER=(HTTP_X_FORWARDED_PROTO,https)
        # and SECURE_SSL_REDIRECT in prod — without this it would redirect-loop.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
